[package]
name = "nyquest-backend-curl"
description = "libcurl backend for nyquest"
version = "0.5.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
exclude.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["ssl"]
async = [
    "nyquest-interface/async",
    "dep:futures-channel",
    "dep:futures-util",
    "dep:slab",
]
async-ws = [
    "async",
    "nyquest-interface/async-ws",
    "dep:futures-core",
    "dep:futures-sink",
]
async-stream = ["async", "nyquest-interface/async-stream"]
blocking = ["nyquest-interface/blocking"]
blocking-stream = ["blocking", "nyquest-interface/blocking-stream"]
blocking-ws = ["blocking", "nyquest-interface/blocking-ws"]
multipart = ["nyquest-interface/multipart"]
ssl = ["curl/ssl"]
charset = ["dep:iconv-native"]
charset-defaults = ["charset", "iconv-native/default"]

[dependencies]
nyquest-interface = { version = "0.5.0", path = "../../nyquest-interface", default-features = false }
curl = { version = "0.4.51", features = [
    "poll_7_68_0",
], default-features = false }
curl-sys = { version = "0.4", default-features = false }
socket2 = "0.6"
iconv-native = { workspace = true, optional = true, default-features = false }
futures-channel = { workspace = true, optional = true, default-features = false, features = [
    "alloc",
] }
futures-core = { workspace = true, optional = true, default-features = false, features = [
    "alloc",
] }
futures-sink = { workspace = true, optional = true, default-features = false, features = [
    "alloc",
] }
futures-util = { workspace = true, optional = true, default-features = false, features = [
    "std",
    "io",
] }
slab = { version = "0.4", optional = true, default-features = false }
pin-project-lite.workspace = true
libc = "0.2.42"
memchr = { workspace = true, default-features = false }
