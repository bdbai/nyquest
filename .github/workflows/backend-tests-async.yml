name: Test backends (async)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-async-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # NOTE: the `idn` feature (IDNA punycode cookie matching) is intentionally
      # not enabled here: the Ubuntu CI libcurl build cannot convert
      # `münchen.de` to punycode, so `test_idna_cookie_domain_matching` fails.
      # It is covered locally where the system libcurl has IDN support.
      - name: Test curl
        run: cargo test -p nyquest-backend-tests --verbose --features async-ws,curl,multipart,cookies,async-progress

  test-async-windows-winrt:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Test winrt
        run: cargo test -p nyquest-backend-tests --verbose --features async-ws,winrt,multipart,cookies,async-progress,idn

  test-async-windows-winhttp:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Test winhttp
        run: cargo test -p nyquest-backend-tests --verbose --features async-ws,winhttp,multipart,cookies,async-progress

  test-async-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Test nsurlsession
        run: cargo test -p nyquest-backend-tests --verbose --features async-ws,nsurlsession,multipart,cookies,async-progress,idn

  test-async-reqwest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Test reqwest
        run: cargo test -p nyquest-backend-tests --verbose --features async-ws,reqwest,multipart,cookies,async-progress,idn
