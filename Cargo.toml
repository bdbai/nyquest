[workspace]
members = [
    "nyquest-interface",
    "nyquest-backend-tests",
    "backends/*",
    "examples/*",
    "presets/*",
]
resolver = "2"

[workspace.package]
authors = ["bdbai <bdbaiapp@163.com>"]
categories = ["web-programming::http-client"]
edition = "2021"
keywords = ["http", "client", "native", "winhttp", "nsurlsession"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bdbai/nyquest"
rust-version = "1.80"
exclude = [".vscode/*", ".github/*", "examples/README.md", "rustfmt.toml"]

[workspace.dependencies]
futures = "0.3.31"
futures-core = { version = "0.3", default-features = false }
futures-sink = { version = "0.3", default-features = false }
futures-channel = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false }
thiserror = "2"
cfg-if = "1"
serde = "1"
serde_json = "1.0.140"
pin-project-lite = "0.2"
memchr = { version = "2", default-features = false }
form_urlencoded = { version = "1", default-features = false }
iconv-native = { version = "0.2.0", default-features = false }
tokio = { version = "1", default-features = false }
tokio-tungstenite = "0.30"
percent-encoding = "2"

[package]
name = "nyquest"
description = "truly platform-native HTTP client library"
version = "0.5.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
exclude.workspace = true

[package.metadata.docs.rs]
features = ["async-stream", "blocking-stream", "multipart", "json", "async-ws", "blocking-ws", "cookies", "async-progress", "blocking-progress"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
async = ["nyquest-interface/async"]
async-stream = ["async", "nyquest-interface/async-stream"]
async-ws = ["async", "nyquest-interface/async-ws"]
blocking = ["nyquest-interface/blocking"]
blocking-stream = ["blocking", "nyquest-interface/blocking-stream"]
blocking-ws = ["blocking", "nyquest-interface/blocking-ws"]
cookies = ["nyquest-interface/cookies"]
multipart = ["nyquest-interface/multipart"]
json = ["dep:serde", "dep:serde_json"]
async-progress = ["async", "dep:futures-core", "nyquest-interface/async-progress"]
blocking-progress = ["blocking", "nyquest-interface/blocking-progress"]

[dependencies]
nyquest-interface = { version = "0.5.0", path = "nyquest-interface", default-features = false }
thiserror.workspace = true
futures-core = { workspace = true, optional = true }

serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
futures.workspace = true
